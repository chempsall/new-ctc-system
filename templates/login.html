<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign in — Resource Forecast</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/dashboard.css') }}">
  <style>
    .login-wrap  { min-height: 100vh; display: flex; align-items: center;
                   justify-content: center; background: var(--surface-2); }
    .login-card  { background: var(--surface); border: 1px solid var(--border);
                   border-radius: var(--radius, 10px); padding: 36px 40px;
                   width: 380px; box-shadow: 0 4px 24px rgba(0,0,0,0.06); }
    .login-title { font-size: 18px; font-weight: 600; margin-bottom: 4px; }
    .login-sub   { font-size: 12px; color: var(--text-secondary); margin-bottom: 22px; }
    .login-card label { font-size: 11px; font-weight: 500; text-transform: uppercase;
                   letter-spacing: 0.06em; color: var(--text-tertiary);
                   display: block; margin-bottom: 6px; }
    .login-card input, .login-card select {
                   width: 100%; font-family: var(--font-body); font-size: 13px;
                   padding: 8px 10px; border: 1px solid var(--border);
                   border-radius: var(--radius-sm, 6px); background: var(--surface-2);
                   color: var(--text-primary); margin-bottom: 14px; }
    .login-card select { cursor: pointer; }
    .login-btn   { width: 100%; padding: 9px 0; font-size: 13px; font-weight: 600;
                   border: none; border-radius: var(--radius-sm, 6px);
                   background: var(--blue, #2C72C7); color: #fff; cursor: pointer; }
    .login-btn:hover { filter: brightness(1.06); }
    .login-error { font-size: 12px; color: #e34948; margin-bottom: 12px; }
    .login-note  { font-size: 11px; color: var(--text-tertiary); margin-top: 16px;
                   line-height: 1.5; }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="login-title">Resource Forecast</div>
      <div class="login-sub">WSP London Building Services</div>

      {% if error %}<div class="login-error">{{ error }}</div>{% endif %}

      <form method="POST" action="/login">
        <input type="hidden" name="next" value="{{ request.args.get('next', '/') }}">

        <label for="login-search">Find your name</label>
        <input type="text" id="login-search" placeholder="Type to filter…"
               autocomplete="off" autofocus>

        <label for="login-select">Sign in as</label>
        <select name="horizon_person_number" id="login-select" size="8" required>
          {% for s in staff %}
          <option value="{{ s.horizon_person_number }}">{{ s.name }}</option>
          {% endfor %}
        </select>

        <button type="submit" class="login-btn" id="login-btn" disabled>Continue</button>
        <div class="login-hint" id="login-hint">Select your name from the list.</div>
      </form>

      <div class="login-note">
        Your name is recorded against the changes you make
        (“last edited by”). No password is required on the WSP network
        during alpha testing.
      </div>
    </div>
  </div>

  <script>
    // Filter the list as the user types. Nothing is ever auto-selected while
    // more than one person matches: every change is recorded against whoever
    // signs in, so picking the wrong name must take a deliberate action rather
    // than an unlucky Enter press. A filter that matches exactly one person is
    // unambiguous, so that one is selected for convenience.
    const search = document.getElementById("login-search");
    const select = document.getElementById("login-select");
    const button = document.getElementById("login-btn");
    const hint   = document.getElementById("login-hint");
    const options = [...select.options];

    function refreshState() {
      const chosen = !!select.value;
      button.disabled = !chosen;
      if (chosen) {
        const name = select.options[select.selectedIndex]?.textContent || "";
        hint.textContent = `Signing in as ${name}.`;
      } else if (select.options.length === 0) {
        hint.textContent = "No matching name — check the spelling.";
      } else {
        hint.textContent = "Select your name from the list.";
      }
    }

    search.addEventListener("input", () => {
      const q = search.value.toLowerCase();
      select.innerHTML = "";
      const matches = options.filter(o => o.textContent.toLowerCase().includes(q));
      matches.forEach(o => select.appendChild(o));
      // Only pre-select when there is no ambiguity at all.
      select.selectedIndex = (matches.length === 1) ? 0 : -1;
      refreshState();
    });

    select.addEventListener("change", refreshState);

    search.addEventListener("keydown", e => {
      if (e.key === "Enter") {
        e.preventDefault();
        // Enter signs in only when one person is unambiguously selected.
        if (select.value) select.form.requestSubmit();
      } else if (e.key === "ArrowDown" && select.options.length) {
        // Let the keyboard reach the list without touching the mouse.
        e.preventDefault();
        select.focus();
        if (select.selectedIndex < 0) select.selectedIndex = 0;
        refreshState();
      }
    });

    select.addEventListener("dblclick", () => {
      if (select.value) select.form.requestSubmit();
    });

    refreshState();
  </script>
</body>
</html>
